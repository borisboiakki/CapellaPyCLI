[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capcli"
version = "0.1.0"
description = "Agent-friendly command line for reading and editing Capella models, built on py-capellambse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "capellambse>=0.8,<0.9",
    "click>=8.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
capcli = "capcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
