[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capcli"
version = "0.1.0"
description = "Agent-friendly command line for reading and editing Capella models, built on py-capellambse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "capellambse>=0.8,<0.9",
    "click>=8.1",
    "lxml",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
capcli = "capcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "PIE"]
ignore = [
    "E501",   # long JSON/XML literals and error messages read better on one line
    "E731",   # small lambdas in OPS tables and predicates
]

[tool.ruff.lint.isort]
known-first-party = ["capcli", "helpers"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true  # capellambse ships no type information for its dynamic accessors
